<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Complete preparation checklist tasks for library equipment."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="components.js"></script>
    <title>LibraryDesk | Preparation Checklist</title>
  </head>
  <body class="preparation-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="app-shell">
      <app-sidebar current="preparation"></app-sidebar>
      <div class="page-container">
        <app-header breadcrumbs='[{"label":"Preparation dashboard","href":"preparation-progress.html"},{"label":"Equipment details","href":"preparation-details.html"},{"label":"Checklist"}]'></app-header>
        <main id="main-content">
          <section
            class="page-introduction"
            aria-labelledby="checklist-heading"
          >
            <p class="eyebrow">University Library · Equipment preparation</p>
            <h1 id="checklist-heading">Preparation checklist</h1>
          </section>
          <section
            class="equipment-detail-panel"
            aria-labelledby="equipment-name"
          >
            <div class="equipment-detail-heading">
              <span class="equipment-detail-icon" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <rect x="3" y="6" width="18" height="12" rx="2"></rect>
                  <path d="M8 10v4M6 12h4M16 10v.01M18 12v.01"></path></svg
              ></span>
              <div>
                <p class="equipment-id">EQ-014 · University Library</p>
                <h2 id="equipment-name">Game Console</h2>
                <span class="status-badge in-progress">In preparation</span>
              </div>
              <div class="equipment-target">
                <span>Target date</span><strong>15 Oct 2026</strong>
              </div>
            </div>
            <preparation-steps active="3"></preparation-steps>
            <div class="checklist-heading">
              <h3>Preparation steps</h3>
              <span>0 / 4 complete</span>
            </div>
            <div class="checklist-items">
              <label class="checklist-row"
                ><input type="checkbox" /><span
                  ><strong>Sanitize Device</strong><small>Pending</small></span
                ></label
              >
              <label class="checklist-row"
                ><input type="checkbox" /><span
                  ><strong>Wipe User Data</strong><small>Pending</small></span
                ></label
              >
              <label class="checklist-row"
                ><input type="checkbox" /><span
                  ><strong>Inventory Check</strong><small>Pending</small></span
                ></label
              >
              <label class="checklist-row"
                ><input type="checkbox" /><span
                  ><strong>Repackage</strong><small>Pending</small></span
                ></label
              >
            </div>
            <label class="details-label" for="issue-notes">Issue notes</label
            ><textarea
              id="issue-notes"
              rows="4"
              placeholder="Add notes if any"
            ></textarea>
            <div class="detail-actions">
              <button class="secondary-action" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 4h11l3 3v13H5zM8 4v6h8V4M8 20v-6h8v6"></path></svg
                >Save progress</button
              ><a class="primary-action" href="preparation-review-details.html"
                >Submit for review<svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12h13M13 6l6 6-6 6"></path></svg
              ></a>
            </div>
          </section>
        </main>
        <app-footer></app-footer>
      </div>
    </div>
  </body>
</html>

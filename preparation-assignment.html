<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Assign preparation tasks for library equipment."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="components.js"></script>
    <title>LibraryDesk | Equipment Assignment</title>
  </head>
  <body class="preparation-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="app-shell">
      <app-sidebar current="preparation"></app-sidebar>
      <div class="page-container">
        <app-header breadcrumbs='[{"label":"Preparation dashboard","href":"preparation-progress.html"},{"label":"Equipment details","href":"preparation-details.html"},{"label":"Assignment"}]'></app-header>
        <main id="main-content">
          <section
            class="page-introduction"
            aria-labelledby="assignment-heading"
          >
            <p class="eyebrow">University Library · Equipment preparation</p>
            <h1 id="assignment-heading">Equipment assignment</h1>
          </section>
          <section
            class="equipment-detail-panel"
            aria-labelledby="equipment-name"
          >
            <div class="equipment-detail-heading">
              <span class="equipment-detail-icon" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <rect x="3" y="6" width="18" height="12" rx="2"></rect>
                  <path d="M8 10v4M6 12h4M16 10v.01M18 12v.01"></path></svg
              ></span>
              <div>
                <p class="equipment-id">EQ-014 · University Library</p>
                <h2 id="equipment-name">Game Console</h2>
                <span class="status-badge">Needs preparation</span>
              </div>
              <div class="equipment-target">
                <span>Target date</span><strong>15 Oct 2026</strong>
              </div>
            </div>
            <preparation-steps active="2"></preparation-steps>
            <form
              class="assignment-form"
              action="preparation-details.html"
              method="get"
            >
              <div class="assignment-fields">
                <div>
                  <label for="staff-member">Select staff member</label
                  ><select id="staff-member" name="staff-member" required>
                    <option value="">Select staff member</option>
                    <option>Linda Kovacs</option>
                    <option>John Doe</option>
                    <option>Maria Santos</option>
                    <option>Alex Chen</option>
                  </select>
                </div>
                <div>
                  <label for="target-date">Target date</label
                  ><input
                    id="target-date"
                    name="target-date"
                    type="date"
                    value="2026-10-15"
                    required
                  />
                </div>
              </div>
              <h3>Select tasks to assign</h3>
              <div class="task-options">
                <label
                  ><input
                    type="checkbox"
                    name="task"
                    value="sanitize-device"
                  />Sanitize Device</label
                ><label
                  ><input
                    type="checkbox"
                    name="task"
                    value="wipe-user-data"
                  />Wipe User Data</label
                ><label
                  ><input
                    type="checkbox"
                    name="task"
                    value="inventory-check"
                  />Inventory Check</label
                ><label
                  ><input
                    type="checkbox"
                    name="task"
                    value="repackage"
                  />Repackage</label
                >
              </div>
              <label for="assignment-instructions"
                >Additional instructions</label
              ><textarea
                id="assignment-instructions"
                name="instructions"
                rows="4"
                placeholder="Add instructions"
              ></textarea>
              <div class="detail-actions">
                <a class="secondary-action" href="preparation-details.html"
                  >Cancel</a
                ><button class="primary-action" type="submit">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M5 4h11l3 3v13H5zM8 4v6h8V4M8 20v-6h8v6"
                    ></path></svg
                  >Save assignment
                </button>
              </div>
            </form>
          </section>
        </main>
        <app-footer></app-footer>
      </div>
    </div>
  </body>
</html>
